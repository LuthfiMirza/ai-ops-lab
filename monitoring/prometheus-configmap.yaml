apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "ai-ops-api"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["sentiment-api-service.ai-ops.svc.cluster.local:8000"]
            labels:
              app: "sentiment-api"
              environment: "local-kind"

  alert-rules.yml: |
    groups:
      - name: ai-ops-sentiment-service-alerts
        rules:
          - alert: ServiceDown
            expr: up{job="ai-ops-api"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Sentiment API is Down"
              description: "Prometheus cannot scrape sentiment-api-service for more than 30 seconds."

          - alert: HighHttpErrorRate
            expr: (sum(rate(http_requests_total{status_code=~"5.."}[1m])) / sum(rate(http_requests_total[1m]))) * 100 > 5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP 5xx Error Rate"
              description: "HTTP 5xx error rate is above 5% over the last 1 minute."

          - alert: HighInferenceLatency
            expr: histogram_quantile(0.95, sum(rate(model_inference_duration_seconds_bucket[1m])) by (le)) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High Model Inference Latency"
              description: "95th percentile model inference latency is higher than 500ms over 1 minute."
