# Kind cluster configuration with ingress port mappings
# hostPort 8080 and 8443 are mapped to avoid collision with local XAMPP Apache on port 80
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-ops-lab
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
