name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 Static Analysis (Syntax & Logic Errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Flake8 Style & Complexity Linter
        run: |
          flake8 app tests model --max-line-length=120 --statistics

      - name: Validate Model Training Pipeline
        run: |
          python model/train.py

      - name: Run Automated Pytest Suite
        run: |
          pytest tests/ -v

  build-container:
    name: Build & Smoke Test Container
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ai-ops-lab-api:ci-test .

      - name: Run Container Smoke Test
        run: |
          docker run -d --name smoke-test-api -p 8000:8000 ai-ops-lab-api:ci-test
          echo "Waiting for container API to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "API is healthy!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 1
          done

          # Test health probe
          curl -f http://localhost:8000/health

          # Test prediction endpoint
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"inputs": "IHSG ditutup menguat didorong reli saham perbankan"}'

          # Test metrics endpoint
          curl -f http://localhost:8000/metrics | grep "http_requests_total"

      - name: Clean Up Smoke Test Container
        if: always()
        run: |
          docker stop smoke-test-api || true
          docker rm smoke-test-api || true
